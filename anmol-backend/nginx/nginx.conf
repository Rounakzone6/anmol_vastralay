worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Basic Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip Compression (Speeds up responses)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zone (Protects against DDoS at the Proxy level)
    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

    # Upstream backend (Your NestJS app)
    upstream anmol_backend {
        # This should point to where your Node app is running
        server 127.0.0.1:3001; 
    }

    server {
        listen 80;
        server_name api.yourdomain.com; # Replace with your actual domain or IP

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        location / {
            # Apply rate limiting
            limit_req zone=mylimit burst=20 nodelay;

            # Reverse Proxy settings
            proxy_pass http://anmol_backend;
            
            # Pass original request info to the Node backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (Required if you use WebSockets/Socket.io later)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
        }

        # Let NGINX directly serve static uploads (Optional but faster than Node)
        # location /uploads/ {
        #     alias /path/to/your/backend/uploads/;
        #     expires 30d;
        # }
    }
}
