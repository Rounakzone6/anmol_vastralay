worker_processes auto;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Basic Performance Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Gzip Compression (Speeds up responses)
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zone (Protects against DDoS at the Proxy level)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    # =========================================================================
    # UPSTREAM LOAD BALANCER (HORIZONTAL SCALING)
    # Distributes requests across all scaled backend instances (e.g. backend:3001)
    # =========================================================================
    upstream anmol_backend {
        # least_conn routes incoming requests to the backend instance with the fewest active connections
        least_conn;

        # Docker internal service discovery or server endpoints
        server backend:3001 max_fails=3 fail_timeout=10s;

        # Localhost fallback when testing outside Docker network
        # server 127.0.0.1:3001 backup;

        # Keepalive connection pool (eliminates TCP connection overhead per request)
        keepalive 64;
    }

    server {
        listen 80;
        server_name _; # Accept all incoming requests / hosts

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health & Diagnostic Probes (Used by AWS ALB / Docker Swarm / Kubernetes probes)
        location /health {
            proxy_pass http://anmol_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            access_log off;
        }

        # Observability: Prometheus Metrics Scraping Endpoint
        location /metrics {
            proxy_pass http://anmol_backend/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # To restrict to internal scraping agents in production:
            # allow 10.0.0.0/8;
            # allow 127.0.0.1;
            # deny all;
            access_log off;
        }

        # Edge CDN Caching for Static Assets & Images
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|avif|woff|woff2|svg|ttf|eot)$ {
            proxy_pass http://anmol_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            access_log off;
        }

        # Main API Proxy
        location / {
            # Apply proxy-level rate limiting with burst allowance
            limit_req zone=api_limit burst=100 nodelay;

            # Reverse Proxy settings
            proxy_pass http://anmol_backend;
            
            # HTTP/1.1 with Keepalive
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Forward original request metadata to the Node backend
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header X-Correlation-ID $request_id;

            # WebSocket support (for realtime features)
            proxy_set_header Upgrade $http_upgrade;
            proxy_cache_bypass $http_upgrade;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffer settings for high-throughput responses
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
